# Release record of Owen on Sin: a print volume made of the editions of
# other books (volume.toml). ./fgb release checks it; the editor signs a
# version off with a signed tag, john-owen/owen-on-sin/vN (./fgb release sign).

# One or two sentences for the release catalog: the volume, its books.
summary = "Owen's Of Temptation (1658) and The Mortification of Sin (1656) in one paperback, Of Temptation first: each is the text of its own edition here, unchanged, with its own ebook and record of every change."

# The signed versions of the books this volume is made from, each
# one's newest sign-off: ./fgb release record john-owen/owen-on-sin writes them again
# after a book is signed off again (then sign the volume off again).

[[book]]
book = "john-owen/of-temptation"
version = "v3"

[[book]]
book = "john-owen/the-mortification-of-sin"
version = "v3"

# The Modern English edition of this volume: a paperback of its own, made from the
# books' Modern English editions (its -modern print file), signed off on its own
# (john-owen/owen-on-sin/modern/vN: ./fgb release sign john-owen/owen-on-sin --modern), with its
# own Lulu revisions. A change to this table holds back only it.
[modern]
# One or two sentences for the release catalog: the Modern English volume, its books.
summary = "Owen's Of Temptation (1658) and The Mortification of Sin (1656) in one paperback in Modern English, Of Temptation first: each is the text of its own Modern English edition, unchanged."
# Stray footnotes in its print PDF the editor accepts, each by its message:
# accepted_print = []

# The signed Modern English versions of the books it is made from,
# each one's newest Modern sign-off (<author>/<book>/modern/vN), written
# by ./fgb release record as for the Classic's above.

[[modern.book]]
book = "john-owen/of-temptation"
version = ""

[[modern.book]]
book = "john-owen/the-mortification-of-sin"
version = ""
