# Release record of The Death of Death in the Death of Christ: what this
# edition is made from. ./fgb release checks it; the editor signs a version
# off with a signed tag, john-owen/the-death-of-death/vN (./fgb release sign).

# One or two sentences for the release catalog: the edition, its source.
summary = "Owen's Death of Death in the Death of Christ in William Goold's text, as CCEL gives it, with CCEL's slips corrected against Goold's printing and Owen's own wording, chiefly his quotations of Scripture, restored from the 1648 first edition."


