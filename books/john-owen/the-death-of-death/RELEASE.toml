# check takes the page's footnotes to begin; its column head "Universalists."
# reads as a note broken over. The page was looked at as rendered: it is the
# table, whole, and no footnote.
accepted_print = [
  "the-death-of-death.pdf: a footnote is broken over to page 454: “Universalists.”",
]

