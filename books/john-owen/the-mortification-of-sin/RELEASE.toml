# One or two sentences for the release catalog: the edition, its source.
summary = "Owen's Of the Mortification of Sin in Believers from the second edition (London, 1668), the last in Owen's lifetime, EEBO-TCP A53715, its gaps restored from the page and the transcription's slips corrected, with Goold's text (1850-53) as a witness; and a Modern English edition of it."

