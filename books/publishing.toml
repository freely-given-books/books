# Where each book is published, by book folder (<author>/<book>); a release's
# site.json carries it to books.freely.giving (its sync-freely-given script).
# Kept here, outside the book folders, so editing it never holds a signed-off
# book back.
#   lulu  Lulu's shop page for the paperback; a book in volumes lists one per
#         volume, in order. "" = not on Lulu yet, or not recorded yet.
#   slug  the site's book slug, when it is not the book's folder name
#   note  anything particular to this book's import, for the site's Claude
#   ready the editor called the book ready to sign as it stands at this
#         commit (./fgb release ready BOOK; signed with its Lulu revision)
#   paperback  true: a printed copy is offered (its Lulu link, shown once the
#         site is built with PRINT_ON_SALE=on). Unset: digital only, the site
#         says nothing of a paperback (the editor, 2026-11-18: a gentle launch
#         with Simon Magus, Domestical Duties and Glorious Feast in print).
#         false: no paperback of its own (printed in a volume)

